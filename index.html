<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Voice Generator (Gemini TTS)</title>
    <style>
        body { font-family: sans-serif; background-color: #0b132b; color: #ffffff; padding: 20px; max-width: 500px; margin: auto; }
        .card { background: #1c2541; padding: 20px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #3a506b; }
        h2 { text-align: center; color: #4cc9f0; margin-top: 0; }
        label { display: block; margin-top: 10px; color: #a5a5a5; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 10px; margin-top: 5px; border-radius: 8px; border: 1px solid #3a506b; background: #0b132b; color: #fff; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #4cc9f0; border: none; border-radius: 8px; color: #000; font-weight: bold; margin-top: 15px; cursor: pointer; }
        button:hover { background: #48bfe3; }
        .save-btn { background: #2ec4b6; margin-top: 8px; }
        audio { width: 100%; margin-top: 15px; }
    </style>
</head>
<body>

    <h2>🎙️ AI Voice Generator</h2>

    <!-- API Key Section -->
    <div class="card">
        <label>🔑 Gemini API Key</label>
        <input type="password" id="apiKey" placeholder="API Key ထည့်ပါ...">
        <button class="save-btn" onclick="saveKey()">💾 API Key သိမ်းဆည်းမည်</button>
    </div>

    <!-- Voice Settings -->
    <div class="card">
        <label>🎭 Voice Character</label>
        <select id="voiceSelect">
            <option value="Puck">Puck (အမျိုးသားအသံ)</option>
            <option value="Charon">Charon (အမျိုးသားအသံ)</option>
            <option value="Kore">Kore (အမျိုးသမီးအသံ)</option>
            <option value="Fenrir">Fenrir (အမျိုးသားအသံ)</option>
            <option value="Zephyr">Zephyr (အမျိုးသမီးအသံ)</option>
        </select>

        <label>🎭 Voice Emotion (ခံစားချက် / ပြောဆိုပုံ)</label>
        <select id="emotionSelect">
            <option value="Natural">Natural (ပုံမှန်)</option>
            <option value="Happy">Happy (ဝမ်းသာစွာ)</option>
            <option value="Calm">Calm (တည်ငြိမ်စွာ)</option>
            <option value="Serious">Serious (လေးနက်စွာ)</option>
            <option value="Dramatic">Dramatic (ဇာတ်ရှိန်ပါစွာ)</option>
            <option value="Whisper">Whisper (တိုးတိုးလေး)</option>
        </select>
    </div>

    <!-- Text Script Input -->
    <div class="card">
        <label>✍️ Voice Script</label>
        <textarea id="scriptText" rows="5" placeholder="အသံထုတ်ချင်တဲ့ စာသားကို ဒီနေရာမှာ ရေးပါ..."></textarea>
        <button onclick="generateSpeech()">🚀 အသံဖိုင် ဖန်တီးမည် (Generate)</button>
        <audio id="audioPlayer" controls></audio>
    </div>

    <script>
        // Browser ထဲမှာ API Key မှတ်ထားပေးခြင်း
        window.onload = function() {
            const savedKey = localStorage.getItem("gemini_api_key");
            if (savedKey) document.getElementById("apiKey").value = savedKey;
        };

        function saveKey() {
            const key = document.getElementById("apiKey").value;
            localStorage.setItem("gemini_api_key", key);
            alert("API Key ကို Browser ထဲမှာ သိမ်းဆည်းလိုက်ပါပြီ!");
        }

        async function generateSpeech() {
            const apiKey = document.getElementById("apiKey").value;
            const text = document.getElementById("scriptText").value;
            const voice = document.getElementById("voiceSelect").value;
            const emotion = document.getElementById("emotionSelect").value;

            if (!apiKey || !text) {
                alert("API Key နှင့် စာသား ဖြည့်စွက်ပေးပါ။");
                return;
            }

            const promptText = `Speak the following text in a ${emotion} tone: ${text}`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: promptText }] }],
                        generationConfig: {
                            responseModalities: ["AUDIO"],
                            speechConfig: {
                                voiceConfig: {
                                    prebuiltVoiceConfig: { voiceName: voice }
                                }
                            }
                        }
                    })
                });

                const data = await response.json();
                const audioBase64 = data.candidates[0].content.parts[0].inlineData.data;
                const mimeType = data.candidates[0].content.parts[0].inlineData.mimeType || "audio/mp3";
                
                document.getElementById("audioPlayer").src = `data:${mimeType};base64,${audioBase64}`;
                document.getElementById("audioPlayer").play();

            } catch (error) {
                alert("အသံဖိုင် ထုတ်ယူရာတွင် အမှားအယွင်းရှိပါသည်: " + error.message);
            }
        }
    </script>
</body>
</html>
